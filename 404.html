<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página no encontrada — Melao</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/melao-carballo-web/assets/img/logo/logo-melao-96.png" type="image/png">
<link rel="apple-touch-icon" href="/melao-carballo-web/assets/img/logo/icon-180.png">
<meta name="theme-color" content="#241608">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,420;0,9..144,680&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/melao-carballo-web/css/style.css">
<style>
  /* Kept deliberately small and self-contained — GitHub Pages serves this
     file for any unmatched path, so every asset/link above and below uses
     an absolute /melao-carballo-web/... path rather than a relative one
     (a relative path would resolve against whatever bogus URL the visitor
     typed, not against the site root, and quietly 404 a second time). If
     this site ever moves to its own domain, update those paths here the
     same way the other absolute URLs are updated (see README). */
  body { display: flex; min-height: 100vh; }
  .notfound { margin: auto; max-width: 32rem; padding: 3rem 1.5rem; text-align: center; }
  .notfound-mark { width: 56px; height: 56px; margin: 0 auto 1.75rem; }
  .notfound-code { font-family: var(--serif); font-size: 0.95rem; font-weight: 600; color: var(--ink-faint); letter-spacing: 0.08em; }
  .notfound h1 {
    margin-top: 0.75rem;
    font-family: var(--serif);
    font-size: clamp(1.9rem, 5vw, 2.8rem);
    font-weight: 560;
    line-height: 1.15;
  }
  .notfound p { margin-top: 1.1rem; color: var(--ink-soft); font-size: 1.05rem; line-height: 1.6; }
  .notfound-actions { margin-top: 2.25rem; display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
</style>
</head>
<body>
  <main class="notfound">
    <img class="notfound-mark" src="/melao-carballo-web/assets/img/logo/logo-melao-96.png" alt="" width="56" height="56">
    <p class="notfound-code">Error 404</p>
    <h1>Esto no estaba en la carta.</h1>
    <p>
      La página que buscas no existe o se ha movido. Prueba a volver al inicio, o pásate directamente por
      la carta — seguro que ahí encuentras algo mejor.
    </p>
    <div class="notfound-actions">
      <a class="btn btn-primary" href="/melao-carballo-web/"><span>Volver al inicio</span></a>
      <a class="btn btn-ghost" href="/melao-carballo-web/#carta"><span>Ver la carta</span></a>
    </div>
  </main>
</body>
</html>
